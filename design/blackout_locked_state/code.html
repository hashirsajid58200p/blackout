<style>
        body {
            background-color: #000000;
        }
        .eclipse-icon {
            border-width: 1.5px;
            border-color: #ffffff;
            box-shadow: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen bg-tertiary text-on-tertiary selection:bg-on-tertiary selection:text-tertiary">
<main class="h-screen w-full flex flex-col px-margin-page py-stack-lg">
<!-- Center Content -->
<div class="flex-1 flex flex-col items-center justify-center text-center">
<!-- Eclipse Icon -->
<div class="w-24 h-24 sm:w-32 sm:h-32 rounded-full eclipse-icon bg-tertiary mb-stack-lg flex items-center justify-center transition-transform duration-200">
<!-- Inner minimalist circle representation -->
<div class="w-full h-full rounded-full bg-tertiary border-r border-tertiary-fixed-dim translate-x-[2px]"></div>
</div>
<h1 class="font-headline-lg text-headline-lg mb-stack-sm tracking-tight">Instagram is dark.</h1>
<p class="font-body-lg text-body-lg text-tertiary-fixed-dim">Time's up for today. It unlocks at midnight.</p>
</div>
<!-- Bottom Controls -->
<div class="flex flex-col items-center gap-stack-md mt-auto pb-8">
<p class="font-body-md text-body-md text-tertiary-fixed-dim text-center max-w-[280px]">
                The only way around this is deleting the app. That's the point.
            </p>
<button class="w-full h-touch-target bg-on-tertiary text-tertiary font-label-bold text-label-bold flex items-center justify-center active:scale-95 transition-transform duration-200 uppercase tracking-widest">
                Close
            </button>
</div>
</main>
<script>
        // Micro-interaction for tactile feedback on touch/click
        document.querySelector('button').addEventListener('mousedown', function() {
            this.style.transform = 'scale(0.98)';
        });
        document.querySelector('button').addEventListener('mouseup', function() {
            this.style.transform = 'scale(1)';
            this.style.backgroundColor = '#000000';
            this.style.color = '#ffffff';
            this.style.border = '1px solid #ffffff';
            setTimeout(() => {
                this.style.backgroundColor = '#ffffff';
                this.style.color = '#000000';
                this.style.border = 'none';
            }, 200);
        });
        document.querySelector('button').addEventListener('mouseleave', function() {
            this.style.transform = 'scale(1)';
        });
    </script>
</body></html>

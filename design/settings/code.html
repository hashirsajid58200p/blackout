<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary": "#5e5e5e",
                    "on-primary-container": "#848484",
                    "on-background": "#1a1c1c",
                    "secondary-container": "#e3e2e2",
                    "inverse-primary": "#c6c6c6",
                    "on-primary": "#ffffff",
                    "surface-tint": "#5e5e5e",
                    "outline": "#7e7576",
                    "outline-variant": "#cfc4c5",
                    "on-error": "#ffffff",
                    "surface-bright": "#f9f9f9",
                    "on-surface-variant": "#4c4546",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed": "#e2e2e2",
                    "on-tertiary-container": "#838484",
                    "background": "#f9f9f9",
                    "error-container": "#ffdad6",
                    "primary-fixed": "#e2e2e2",
                    "on-secondary-fixed-variant": "#464747",
                    "surface-variant": "#e2e2e2",
                    "tertiary-fixed-dim": "#c6c6c7",
                    "on-tertiary-fixed-variant": "#454747",
                    "on-tertiary-fixed": "#1a1c1c",
                    "error": "#ba1a1a",
                    "primary-fixed-dim": "#c6c6c6",
                    "inverse-on-surface": "#f0f1f1",
                    "on-tertiary": "#ffffff",
                    "tertiary": "#000000",
                    "on-secondary-fixed": "#1b1c1c",
                    "secondary-fixed-dim": "#c7c6c6",
                    "primary": "#000000",
                    "surface-dim": "#dadada",
                    "surface-container-lowest": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-container-highest": "#e2e2e2",
                    "on-surface": "#1a1c1c",
                    "surface": "#f9f9f9",
                    "surface-container": "#eeeeee",
                    "on-primary-fixed-variant": "#474747",
                    "surface-container-low": "#f3f3f4",
                    "surface-container-high": "#e8e8e8",
                    "on-primary-fixed": "#1b1b1b",
                    "secondary-fixed": "#e3e2e2",
                    "on-secondary-container": "#646464",
                    "inverse-surface": "#2f3131",
                    "primary-container": "#1b1b1b",
                    "tertiary-container": "#1a1c1c"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "stack-sm": "8px",
                    "stack-lg": "32px",
                    "margin-page": "24px",
                    "gutter-grid": "16px",
                    "stack-md": "16px",
                    "touch-target": "48px"
            },
            "fontFamily": {
                    "label-sm": ["Inter"],
                    "label-bold": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0", "fontWeight": "400"}],
                    "label-bold": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400"}]
            }
          },
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: 300;
            font-style: normal;
            font-size: 24px;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        /* Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #000000;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #000000;
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
            background-color: #ffffff;
        }
        .toggle-label {
            width: 48px;
            height: 24px;
            background-color: #eeeeee;
            border-radius: 9999px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .toggle-label:after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg antialiased selection:bg-primary selection:text-on-primary">
<!-- Top App Bar -->
<header class="docked full-width top-0 border-b border-primary dark:border-outline-variant flat no shadows flex justify-between items-center w-full px-margin-page h-touch-target bg-background dark:bg-on-background z-50">
<div class="flex items-center">
<button aria-label="Go back" class="h-touch-target w-touch-target flex items-center justify-center -ml-3 text-primary dark:text-on-primary hover:bg-secondary-container dark:hover:bg-secondary transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold tracking-tighter text-primary dark:text-on-primary ml-2">Settings</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-[800px] mx-auto px-margin-page pt-stack-lg pb-32">
<div class="flex flex-col">
<!-- List Item: Manage Tracked Apps -->
<button class="w-full flex items-center justify-between min-h-[56px] py-4 border-b border-surface-container hover:bg-surface-bright transition-colors text-left group">
<span class="font-body-lg text-body-lg text-on-background">Manage Tracked Apps</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- List Item: Notifications (Toggle) -->
<div class="w-full flex items-center justify-between min-h-[56px] py-4 border-b border-surface-container">
<span class="font-body-lg text-body-lg text-on-background">Notifications</span>
<div class="relative inline-block w-12 h-6 align-middle select-none">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 opacity-0" id="notifications-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-container cursor-pointer" for="notifications-toggle"></label>
</div>
</div>
<!-- List Item: Theme Selector -->
<div class="w-full flex items-center justify-between min-h-[56px] py-4 border-b border-surface-container">
<span class="font-body-lg text-body-lg text-on-background">Theme</span>
<div class="flex bg-surface-container rounded-sm p-1">
<button aria-pressed="true" class="px-3 py-1 font-label-bold text-label-bold text-on-primary bg-primary rounded-sm shadow-sm transition-all">Light</button>
<button aria-pressed="false" class="px-3 py-1 font-label-bold text-label-bold text-on-surface-variant hover:text-on-background transition-colors">Dark</button>
</div>
</div>
<!-- List Item: Permissions Status -->
<button class="w-full flex items-center justify-between min-h-[56px] py-4 border-b border-surface-container hover:bg-surface-bright transition-colors text-left group">
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-background">Permissions Status</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">Screen Time access granted</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- List Item: About Blackout -->
<button class="w-full flex items-center justify-between min-h-[56px] py-4 border-b border-surface-container hover:bg-surface-bright transition-colors text-left group">
<span class="font-body-lg text-body-lg text-on-background">About Blackout</span>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-primary transition-colors">v1.2.0</span>
</button>
</div>
</main>
<!-- Bottom Nav Bar (Suppressed on Settings Page as per guidelines) -->
<!-- Navigation shell is hidden because user is in a focused journey / transactional sub-page -->
</body></html>

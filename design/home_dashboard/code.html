<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Home Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary": "#5e5e5e",
                        "on-primary-container": "#848484",
                        "on-background": "#1a1c1c",
                        "secondary-container": "#e3e2e2",
                        "inverse-primary": "#c6c6c6",
                        "on-primary": "#ffffff",
                        "surface-tint": "#5e5e5e",
                        "outline": "#7e7576",
                        "outline-variant": "#cfc4c5",
                        "on-error": "#ffffff",
                        "surface-bright": "#f9f9f9",
                        "on-surface-variant": "#4c4546",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#e2e2e2",
                        "on-tertiary-container": "#838484",
                        "background": "#f9f9f9",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#e2e2e2",
                        "on-secondary-fixed-variant": "#464747",
                        "surface-variant": "#e2e2e2",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "on-tertiary-fixed-variant": "#454747",
                        "on-tertiary-fixed": "#1a1c1c",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#c6c6c6",
                        "inverse-on-surface": "#f0f1f1",
                        "on-tertiary": "#ffffff",
                        "tertiary": "#000000",
                        "on-secondary-fixed": "#1b1c1c",
                        "secondary-fixed-dim": "#c7c6c6",
                        "primary": "#000000",
                        "surface-dim": "#dadada",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e2e2e2",
                        "on-surface": "#1a1c1c",
                        "surface": "#f9f9f9",
                        "surface-container": "#eeeeee",
                        "on-primary-fixed-variant": "#474747",
                        "surface-container-low": "#f3f3f4",
                        "surface-container-high": "#e8e8e8",
                        "on-primary-fixed": "#1b1b1b",
                        "secondary-fixed": "#e3e2e2",
                        "on-secondary-container": "#646464",
                        "inverse-surface": "#2f3131",
                        "primary-container": "#1b1b1b",
                        "tertiary-container": "#1a1c1c"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "margin-page": "24px",
                        "gutter-grid": "16px",
                        "stack-md": "16px",
                        "touch-target": "48px"
                    },
                    fontFamily: {
                        "label-sm": ["Inter"],
                        "label-bold": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    fontSize: {
                        "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0", fontWeight: "400" }],
                        "label-bold": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "700" }],
                        "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "700" }],
                        "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "0", fontWeight: "400" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-md": ["14px", { lineHeight: "20px", letterSpacing: "0", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen relative pb-24 font-body-md antialiased selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<header class="sticky top-0 z-40 bg-background dark:bg-on-background border-b border-primary dark:border-outline-variant flex justify-between items-center w-full px-margin-page h-touch-target">
<button aria-label="Calendar" class="w-8 h-8 flex items-center justify-start text-primary dark:text-on-primary hover:bg-secondary-container dark:hover:bg-secondary transition-colors">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold tracking-tighter text-primary dark:text-on-primary uppercase">Today</h1>
<button aria-label="Settings" class="w-8 h-8 flex items-center justify-end text-primary dark:text-on-primary hover:bg-secondary-container dark:hover:bg-secondary transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<main class="px-margin-page pt-stack-md flex flex-col gap-stack-lg max-w-md mx-auto">
<!-- Date Header -->
<section class="flex flex-col gap-1">
<h2 class="font-headline-lg text-headline-lg text-primary uppercase tracking-tight">Focus</h2>
<p class="font-label-bold text-label-bold text-secondary uppercase">Mon, Oct 24</p>
</section>
<!-- App List -->
<section class="flex flex-col gap-stack-md">
<!-- Instagram -->
<article class="border border-primary bg-surface-container-lowest p-4 flex flex-col gap-stack-md transition-all hover:bg-surface-bright">
<div class="flex justify-between items-center">
<div class="flex items-center gap-2">
<div class="w-8 h-8 bg-surface-container rounded-sm flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[18px]">photo_camera</span>
</div>
<h3 class="font-body-lg text-body-lg text-primary font-bold">Instagram</h3>
</div>
<span class="bg-surface-container text-on-surface font-label-bold text-label-bold px-3 py-1 rounded-full uppercase border border-outline-variant">Active</span>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<span class="font-label-bold text-label-bold text-secondary">42m / 1h limit</span>
<span class="font-label-sm text-label-sm text-primary">70%</span>
</div>
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container rounded-none border border-transparent overflow-hidden">
<div class="h-full bg-secondary transition-all duration-500 ease-out" style="width: 70%;"></div>
</div>
</div>
</article>
<!-- YouTube -->
<article class="border-2 border-primary bg-surface-container-lowest p-4 flex flex-col gap-stack-md relative overflow-hidden">
<!-- Diagonal hash pattern for locked state subtle background -->
<div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: repeating-linear-gradient(45deg, #000 0, #000 1px, transparent 0, transparent 50%); background-size: 8px 8px;"></div>
<div class="flex justify-between items-center relative z-10">
<div class="flex items-center gap-2">
<div class="w-8 h-8 bg-surface-container rounded-sm flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[18px]">play_arrow</span>
</div>
<h3 class="font-body-lg text-body-lg text-primary font-bold">YouTube</h3>
</div>
<span class="bg-primary text-on-primary font-label-bold text-label-bold px-3 py-1 rounded-full uppercase flex items-center gap-1 shadow-[0_0_0_1px_#000]">
<span class="material-symbols-outlined text-[14px]">lock</span>
                        Locked
                    </span>
</div>
<div class="flex flex-col gap-2 relative z-10">
<div class="flex justify-between items-end">
<span class="font-label-bold text-label-bold text-primary">2h / 2h limit</span>
<span class="font-label-sm text-label-sm text-primary">100%</span>
</div>
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container rounded-none overflow-hidden">
<div class="h-full bg-primary transition-all duration-500 ease-out" style="width: 100%;"></div>
</div>
</div>
</article>
</section>
</main>
<!-- Floating Action Button (FAB) -->
<button aria-label="Add new limit" class="fixed bottom-[80px] right-6 w-14 h-14 bg-primary text-on-primary rounded-full flex items-center justify-center z-40 hover:invert transition-all hover:scale-95 duration-200 shadow-none border-2 border-primary">
<span class="material-symbols-outlined text-[28px]" data-icon="add">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-touch-target bg-background dark:bg-on-background border-t-2 border-primary dark:border-outline pb-safe">
<!-- Active Nav Item -->
<a aria-label="Dashboard" class="flex items-center justify-center bg-primary dark:bg-on-primary text-on-primary dark:text-primary rounded-none h-12 w-12 scale-98 transition-transform duration-200" data-active="true" href="#">
<span class="material-symbols-outlined" data-icon="grid_view" data-weight="fill" style="font-variation-settings: 'FILL' 1;">grid_view</span>
</a>
<!-- Inactive Nav Items -->
<a aria-label="History" class="flex items-center justify-center text-primary dark:text-on-primary h-12 w-12 hover:invert transition-all" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
</a>
<a aria-label="Analytics" class="flex items-center justify-center text-primary dark:text-on-primary h-12 w-12 hover:invert transition-all" href="#">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
</a>
<a aria-label="Profile" class="flex items-center justify-center text-primary dark:text-on-primary h-12 w-12 hover:invert transition-all" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
</a>
</nav>
</body></html>
